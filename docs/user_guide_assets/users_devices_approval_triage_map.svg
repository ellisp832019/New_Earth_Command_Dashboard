<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#071620"/>
  <rect x="54" y="46" width="1492" height="808" rx="28" fill="#112733" stroke="#1d4759" stroke-width="2"/>
  <text x="94" y="112" fill="#f2f7f8" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">Approval Queue Triage</text>
  <text x="94" y="150" fill="#89a9b8" font-family="Segoe UI, Arial, sans-serif" font-size="20">Use this flow when a sensitive action is valid in principle but still needs a human decision.</text>
  <rect x="94" y="206" width="1412" height="90" rx="22" fill="#17313f" stroke="#71e3d2" stroke-width="3"/>
  <text x="126" y="252" fill="#f2f7f8" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">Read the triage strip first</text>
  <text x="126" y="282" fill="#aac3cc" font-family="Segoe UI, Arial, sans-serif" font-size="18">Start with the summary counts, then review the oldest or riskiest pending request before anything already completed.</text>
  <rect x="94" y="344" width="410" height="204" rx="22" fill="#182d39" stroke="#f0c36b" stroke-width="2"/>
  <text x="126" y="392" fill="#f2f7f8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Pending</text>
  <text x="126" y="432" fill="#d8e5ea" font-family="Segoe UI, Arial, sans-serif" font-size="21">Still waiting for operator review.</text>
  <text x="126" y="468" fill="#aac3cc" font-family="Segoe UI, Arial, sans-serif" font-size="18">Open these first. Read the module, user, device, reason,</text>
  <text x="126" y="496" fill="#aac3cc" font-family="Segoe UI, Arial, sans-serif" font-size="18">and any hint that permission or trust still needs fixing.</text>
  <text x="126" y="532" fill="#b8f26d" font-family="Segoe UI, Arial, sans-serif" font-size="18">Action: approve or deny after review</text>
  <rect x="594" y="344" width="410" height="204" rx="22" fill="#182d39" stroke="#78d98a" stroke-width="2"/>
  <text x="626" y="392" fill="#f2f7f8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Approved</text>
  <text x="626" y="432" fill="#d8e5ea" font-family="Segoe UI, Arial, sans-serif" font-size="21">Human review passed.</text>
  <text x="626" y="468" fill="#aac3cc" font-family="Segoe UI, Arial, sans-serif" font-size="18">The original action may still need the user, device,</text>
  <text x="626" y="496" fill="#aac3cc" font-family="Segoe UI, Arial, sans-serif" font-size="18">permission, and trust context to be valid when retried.</text>
  <text x="626" y="532" fill="#b8f26d" font-family="Segoe UI, Arial, sans-serif" font-size="18">Action: retry the original protected step</text>
  <rect x="1094" y="344" width="412" height="204" rx="22" fill="#182d39" stroke="#e48b8b" stroke-width="2"/>
  <text x="1126" y="392" fill="#f2f7f8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Denied</text>
  <text x="1126" y="432" fill="#d8e5ea" font-family="Segoe UI, Arial, sans-serif" font-size="21">Operator rejected the request.</text>
  <text x="1126" y="468" fill="#aac3cc" font-family="Segoe UI, Arial, sans-serif" font-size="18">The action should remain blocked until a new request</text>
  <text x="1126" y="496" fill="#aac3cc" font-family="Segoe UI, Arial, sans-serif" font-size="18">is raised or the underlying conditions change.</text>
  <text x="1126" y="532" fill="#b8f26d" font-family="Segoe UI, Arial, sans-serif" font-size="18">Action: review audit, do not force it through</text>
  <path d="M504 446 L594 446" stroke="#71e3d2" stroke-width="4" stroke-linecap="round"/>
  <polygon points="576,432 602,446 576,460" fill="#71e3d2"/>
  <path d="M1004 446 L1094 446" stroke="#71e3d2" stroke-width="4" stroke-linecap="round"/>
  <polygon points="1076,432 1102,446 1076,460" fill="#71e3d2"/>
  <rect x="94" y="612" width="1412" height="188" rx="24" fill="#10232d" stroke="#2c5365" stroke-width="2"/>
  <text x="126" y="658" fill="#f2f7f8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Daily operator habit</text>
  <text x="126" y="700" fill="#d5e4ea" font-family="Segoe UI, Arial, sans-serif" font-size="21">1. Review `Pending` first.</text>
  <text x="126" y="734" fill="#d5e4ea" font-family="Segoe UI, Arial, sans-serif" font-size="21">2. Use the card hint to decide whether the real problem is approval, trust, permission, or identity.</text>
  <text x="126" y="768" fill="#d5e4ea" font-family="Segoe UI, Arial, sans-serif" font-size="21">3. Confirm the final state in `Audit Log` so the queue and history stay aligned.</text>
</svg>
