<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-label="Device trust flow">
  <defs>
    <style>
      .bg { fill: #081722; }
      .panel { fill: #102634; stroke: #5bc6b8; stroke-width: 2; rx: 18; ry: 18; }
      .node { fill: #163042; stroke: #335466; stroke-width: 2; rx: 18; ry: 18; }
      .good { fill: #17352f; stroke: #71d68a; stroke-width: 2; rx: 18; ry: 18; }
      .warn { fill: #2c2531; stroke: #f0b35b; stroke-width: 2; rx: 18; ry: 18; }
      .text { fill: #eaf6f4; font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; }
      .small { fill: #bed0cf; font-family: Arial, Helvetica, sans-serif; font-size: 17px; }
      .tiny { fill: #92a6ab; font-family: Arial, Helvetica, sans-serif; font-size: 14px; }
      .arrow { stroke: #8fd3d4; stroke-width: 4; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8fd3d4" />
    </marker>
  </defs>
  <rect class="bg" width="1400" height="760" />
  <text class="text" x="60" y="58">Device trust flow</text>
  <text class="small" x="60" y="88">A device becomes trusted only after it is registered, reviewed, confirmed, and written to the local audit trail.</text>

  <rect class="panel" x="60" y="132" width="1280" height="540" />

  <rect class="node" x="92" y="248" width="196" height="100" />
  <text class="text" x="118" y="286">Detect device</text>
  <text class="small" x="118" y="314">Name, type, owner</text>

  <rect class="node" x="336" y="248" width="220" height="100" />
  <text class="text" x="362" y="286">Review pairing</text>
  <text class="small" x="362" y="314">Check the owner and purpose</text>

  <rect class="warn" x="616" y="248" width="220" height="100" />
  <text class="text" x="642" y="286">Trust decision</text>
  <text class="small" x="642" y="314">Confirm or raise trust level</text>

  <rect class="good" x="896" y="248" width="220" height="100" />
  <text class="text" x="922" y="286">Write audit</text>
  <text class="small" x="922" y="314">Keep the decision local</text>

  <rect class="good" x="1176" y="248" width="100" height="100" />
  <text class="text" x="1195" y="286">Ready</text>

  <path class="arrow" d="M288 298 L326 298" />
  <path class="arrow" d="M556 298 L606 298" />
  <path class="arrow" d="M836 298 L886 298" />
  <path class="arrow" d="M1116 298 L1166 298" />

  <rect class="panel" x="92" y="430" width="1240" height="110" />
  <text class="text" x="118" y="472">Trust bands matter</text>
  <text class="small" x="118" y="502">Low-trust devices stay visible for setup, but sensitive screens wait until the device reaches the required trust band.</text>
  <text class="tiny" x="118" y="534">This keeps the local gate strict without feeling mysterious.</text>
</svg>
