<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-label="Security session lifecycle">
  <defs>
    <style>
      .bg { fill: #081722; }
      .panel { fill: #102634; stroke: #5bc6b8; stroke-width: 2; rx: 18; ry: 18; }
      .node { fill: #163042; stroke: #335466; stroke-width: 2; rx: 18; ry: 18; }
      .live { fill: #17352f; stroke: #71d68a; stroke-width: 2; rx: 18; ry: 18; }
      .lock { fill: #2c2531; stroke: #f0b35b; stroke-width: 2; rx: 18; ry: 18; }
      .text { fill: #eaf6f4; font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; }
      .small { fill: #bed0cf; font-family: Arial, Helvetica, sans-serif; font-size: 17px; }
      .tiny { fill: #92a6ab; font-family: Arial, Helvetica, sans-serif; font-size: 14px; }
      .arrow { stroke: #8fd3d4; stroke-width: 4; fill: none; marker-end: url(#arrowHead); }
      .loop { stroke: #f0b35b; stroke-width: 4; stroke-dasharray: 10 8; fill: none; marker-end: url(#arrowHeadWarn); }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8fd3d4" />
    </marker>
    <marker id="arrowHeadWarn" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#f0b35b" />
    </marker>
  </defs>
  <rect class="bg" width="1400" height="760" />
  <text class="text" x="60" y="58">Security session lifecycle</text>
  <text class="small" x="60" y="88">The session box keeps the operator aware of status, timeout, and lock state across the app.</text>

  <rect class="panel" x="60" y="132" width="1280" height="540" />

  <rect class="lock" x="100" y="228" width="210" height="110" />
  <text class="text" x="126" y="270">Locked</text>
  <text class="small" x="126" y="300">No active session</text>

  <rect class="node" x="360" y="228" width="250" height="110" />
  <text class="text" x="390" y="270">Unlock</text>
  <text class="small" x="390" y="300">PIN and identity checked</text>

  <rect class="live" x="670" y="228" width="250" height="110" />
  <text class="text" x="700" y="270">Active</text>
  <text class="small" x="700" y="300">Session countdown starts</text>

  <rect class="node" x="980" y="228" width="250" height="110" />
  <text class="text" x="1010" y="270">Working</text>
  <text class="small" x="1010" y="300">Open modules as allowed</text>

  <rect class="lock" x="670" y="430" width="250" height="110" />
  <text class="text" x="700" y="472">Auto-lock</text>
  <text class="small" x="700" y="502">Inactivity timeout reached</text>

  <path class="arrow" d="M310 283 L350 283" />
  <path class="arrow" d="M610 283 L660 283" />
  <path class="arrow" d="M920 283 L970 283" />
  <path class="loop" d="M1050 338 C1050 390, 860 400, 825 430" />
  <path class="arrow" d="M795 430 L795 372" />

  <rect class="panel" x="100" y="430" width="500" height="110" />
  <text class="text" x="126" y="472">Session box</text>
  <text class="small" x="126" y="502">Active user, online status, timeout window, and live countdown</text>

  <text class="tiny" x="100" y="586">The box gives a quick answer to: who is active, how long is left, and where do I go if I need to inspect security again?</text>
</svg>
