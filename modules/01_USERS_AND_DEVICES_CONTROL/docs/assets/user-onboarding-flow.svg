<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-label="User onboarding flow">
  <defs>
    <style>
      .bg { fill: #081722; }
      .panel { fill: #102634; stroke: #5bc6b8; stroke-width: 2; rx: 18; ry: 18; }
      .node { fill: #163042; stroke: #335466; stroke-width: 2; rx: 18; ry: 18; }
      .good { fill: #17352f; stroke: #71d68a; stroke-width: 2; rx: 18; ry: 18; }
      .text { fill: #eaf6f4; font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; }
      .small { fill: #bed0cf; font-family: Arial, Helvetica, sans-serif; font-size: 17px; }
      .tiny { fill: #92a6ab; font-family: Arial, Helvetica, sans-serif; font-size: 14px; }
      .arrow { stroke: #8fd3d4; stroke-width: 4; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8fd3d4" />
    </marker>
  </defs>
  <rect class="bg" width="1400" height="760" />
  <text class="text" x="60" y="58">User onboarding flow</text>
  <text class="small" x="60" y="88">A calm path for creating a person, setting a role, linking a device, and proving the result locally.</text>

  <rect class="panel" x="60" y="132" width="1280" height="540" />

  <rect class="node" x="100" y="248" width="190" height="100" />
  <text class="text" x="126" y="286">Create user</text>
  <text class="small" x="126" y="314">Name and role</text>

  <rect class="node" x="350" y="248" width="220" height="100" />
  <text class="text" x="376" y="286">Assign permissions</text>
  <text class="small" x="376" y="314">Local capability set</text>

  <rect class="node" x="640" y="248" width="220" height="100" />
  <text class="text" x="666" y="286">Link device</text>
  <text class="small" x="666" y="314">Choose trusted hardware</text>

  <rect class="good" x="930" y="248" width="220" height="100" />
  <text class="text" x="956" y="286">Confirm trust</text>
  <text class="small" x="956" y="314">Record the pairing</text>

  <rect class="good" x="1160" y="248" width="100" height="100" />
  <text class="text" x="1179" y="286">Done</text>

  <path class="arrow" d="M290 298 L340 298" />
  <path class="arrow" d="M570 298 L630 298" />
  <path class="arrow" d="M860 298 L920 298" />
  <path class="arrow" d="M1150 298 L1160 298" />

  <rect class="panel" x="100" y="430" width="1240" height="110" />
  <text class="text" x="126" y="472">What the operator confirms</text>
  <text class="small" x="126" y="502">The name, role, device, and trust level all line up before the user is allowed to unlock sensitive screens.</text>
  <text class="tiny" x="126" y="534">This is the point where onboarding stops being a draft and becomes a reliable local identity.</text>
</svg>
